<svg xmlns="http://www.w3.org/2000/svg" width="680" height="740" viewBox="0 0 680 740" role="img">
<title>Gorilla cart rim cutout layout</title>
<desc>Plan view of the cart rim with 3 cutouts on each long side and 2 on the handle end, 655 mm centre to centre across the cart and 11 inch gaps between cutouts, plus top and section views of a single 51.3 by 19.5 by 63.5 mm cutout.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .rim { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .tub { fill: #FFFFFF; stroke: #888780; stroke-width: 0.5; }
  .cut { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .leader { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 4 3; fill: none; }
  .dim { stroke: #444441; stroke-width: 0.75; fill: none; }
  .head { stroke: #444441; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .handle { stroke: #444441; stroke-width: 3; stroke-linecap: round; }
  .rule { stroke: #D3D1C7; stroke-width: 0.5; }
  @media (prefers-color-scheme: dark) {
    .ts { fill: #B4B2A9; }
    .th { fill: #F1EFE8; }
    .rim { fill: #444441; stroke: #B4B2A9; }
    .tub { fill: #2C2C2A; stroke: #888780; }
    .cut { fill: #085041; stroke: #5DCAA5; }
    .dim, .head { stroke: #D3D1C7; }
    .handle { stroke: #D3D1C7; }
    .rule { stroke: #5F5E5A; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9"/></marker></defs>

<rect class="rim" x="120" y="85" width="440" height="345" rx="16"/>
<rect class="tub" x="170" y="135" width="340" height="245" rx="8"/>
<line class="handle" x1="120" y1="257.5" x2="70" y2="257.5"/>
<line class="handle" x1="70" y1="237" x2="70" y2="278"/>
<text class="ts" x="80" y="300" text-anchor="middle">Handle</text>
<text class="ts" x="80" y="318" text-anchor="middle">end</text>

<rect class="cut" x="179.7" y="105.6" width="23" height="8.8"/>
<rect class="cut" x="328.5" y="105.6" width="23" height="8.8"/>
<rect class="cut" x="477.3" y="105.6" width="23" height="8.8"/>
<rect class="cut" x="179.7" y="400.6" width="23" height="8.8"/>
<rect class="cut" x="328.5" y="400.6" width="23" height="8.8"/>
<rect class="cut" x="477.3" y="400.6" width="23" height="8.8"/>
<rect class="cut" x="140.6" y="171.6" width="8.8" height="23"/>
<rect class="cut" x="140.6" y="320.4" width="8.8" height="23"/>
<text class="ts" x="340" y="160" text-anchor="middle">Long side: 3 cutouts</text>
<text class="ts" x="340" y="362" text-anchor="middle">Long side: 3 cutouts</text>

<line class="leader" x1="202.7" y1="104" x2="202.7" y2="56"/>
<line class="leader" x1="328.5" y1="104" x2="328.5" y2="56"/>
<line class="leader" x1="351.5" y1="104" x2="351.5" y2="56"/>
<line class="leader" x1="477.3" y1="104" x2="477.3" y2="56"/>
<line class="dim" x1="205" y1="62" x2="326" y2="62" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="dim" x1="354" y1="62" x2="475" y2="62" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="265.6" y="50" text-anchor="middle">279.4 mm (11 in)</text>
<text class="ts" x="414.4" y="50" text-anchor="middle">279.4 mm (11 in)</text>

<line class="leader" x1="502" y1="110" x2="604" y2="110"/>
<line class="leader" x1="502" y1="405" x2="604" y2="405"/>
<line class="dim" x1="592" y1="113" x2="592" y2="402" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="th" x="602" y="250">655 mm</text>
<text class="ts" x="602" y="268">centre to</text>
<text class="ts" x="602" y="284">centre</text>

<line class="leader" x1="151" y1="194.6" x2="198" y2="194.6"/>
<line class="leader" x1="151" y1="320.4" x2="198" y2="320.4"/>
<line class="dim" x1="190" y1="197" x2="190" y2="318" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="200" y="252">279.4 mm gap</text>
<text class="ts" x="200" y="270">(assumed, same)</text>
<text class="ts" x="340" y="458" text-anchor="middle">Plan view from above. Widths to scale; cart length not measured</text>

<line class="rule" x1="40" y1="480" x2="640" y2="480"/>

<text class="ts" x="80" y="508">51.3 mm</text>
<line class="dim" x1="82" y1="518" x2="206" y2="518" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect class="cut" x="80" y="530" width="128" height="49"/>
<line class="dim" x1="222" y1="532" x2="222" y2="577" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="230" y="559">19.5 mm</text>
<text class="th" x="80" y="608">Cutout, top view</text>
<text class="ts" x="80" y="630">Long axis runs along the rim</text>
<text class="ts" x="80" y="650">Fitment tolerance: 0.3 mm</text>

<text class="ts" x="355" y="508">19.5 mm</text>
<line class="dim" x1="362" y1="518" x2="407" y2="518" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect class="rim" x="310" y="530" width="50" height="170"/>
<rect class="rim" x="409" y="530" width="50" height="170"/>
<rect class="rim" x="360" y="689" width="49" height="11"/>
<rect class="cut" x="360" y="530" width="49" height="159"/>
<line class="dim" x1="478" y1="532" x2="478" y2="687" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="leader" x1="460" y1="530" x2="486" y2="530"/>
<line class="leader" x1="460" y1="689" x2="486" y2="689"/>
<text class="th" x="490" y="605">63.5 mm</text>
<text class="ts" x="490" y="623">deep</text>
<text class="th" x="310" y="724">Section through cutout</text>
</svg>
