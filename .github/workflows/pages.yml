# Verifies every part, checks the web generator's parameter limits, then builds
# the generator and publishes it to GitHub Pages:
# https://macropin.github.io/brepjs-gorillacart/
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one part-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci
        env:
          # Puppeteer's browser is only for the README renders.
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Verify every part
        run: make verify

      - name: Build every part at the generator's limits
        run: make sweep

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build the generator
        run: make web-build
        env:
          # "/brepjs-gorillacart/" here, or "/" behind a custom domain.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
